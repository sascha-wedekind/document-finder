name: Build macOS .dmg arm64

on:
  release:
    types: [published]

env:
  JAVA_VERSION: 27
  JAVA_DISTRIBUTION: 'zulu'

jobs:

  build:
    name: Build Document-Finder for MacOS ${{ matrix.output-suffix }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            architecture: aarch64
            output-suffix: arm64
    steps:
      - uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          java-package: 'jdk'
          architecture: ${{ matrix.architecture }}
          cache: 'gradle'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build
        run: ./gradlew jpackage -PaotCache
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: DocumentFinder-${{ matrix.output-suffix }}.dmg
          path: build/jpackage/DocumentFinder-*.dmg
          if-no-files-found: error
      - name: Publish dmg on GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            build/jpackage/DocumentFinder-*.dmg
