name: Build Debian *.deb

on:
  release:
    types: [published]

env:
  JAVA_VERSION: 27
  JAVA_DISTRIBUTION: 'zulu'

jobs:

  build:
    name: Build Document-Finder for Debian
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          java-package: 'jdk'
          architecture: x64
          cache: 'gradle'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      # The AOT cache is created by starting the application once, which needs a display
      - name: Install xvfb
        run: sudo apt-get install -y xvfb
      - name: Build
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" ./gradlew jpackage -PaotCache
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: DocumentFinder.deb
          path: build/jpackage/*.deb
          if-no-files-found: error
      - name: Publish dmg on GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            build/jpackage/*.deb
